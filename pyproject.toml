[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "visioncite"
version = "0.2.0"
description = "Multimodal document QA with verifiable visual citations"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "rwbyyyy" }]
keywords = ["multimodal", "document-ai", "rag", "clip", "ocr", "fastapi", "grounding"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.24",
  "pillow>=10.0",
  "pypdfium2>=4.20",
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "python-multipart>=0.0.9",
  "pydantic>=2.5",
]

[project.optional-dependencies]
ocr = ["rapidocr-onnxruntime>=1.3"]
visual = ["torch>=2.1", "transformers>=4.40"]
dev = ["pytest>=8", "pytest-cov>=5", "httpx>=0.27", "ruff>=0.5"]

[project.scripts]
visioncite = "visioncite.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/visioncite"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "slow: 需要模型下载或较长计算，默认环境可跳过",
]

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["reports", "assets", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C901", "D", "ANN"]
# D415/D403：本项目用中文 docstring，句末是"。"，首词也不存在大小写问题，
# 这两条英文写作规则在这里只会制造噪声，因此显式豁免（而不是偷偷关掉整个 D）。
ignore = ["D203", "D213", "D413", "D415", "D403", "ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "ANN", "N806"]
"**/__init__.py" = ["D104"]
# 实验脚本：一次性/面向 ML 库（transformers 无类型），不套用库代码的严格规则
"experiments/*" = ["D", "ANN", "E501"]
# FastAPI 的 File(...)/Depends(...) 必须写在参数默认值里，这是框架约定
"src/visioncite/api/app.py" = ["B008"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.coverage.run]
source = ["visioncite"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
